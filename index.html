  <!-- Spinner shown until the app renders (it waits for translations and fonts).
       Inline so it works before any stylesheet or script loads. -->
  <style>
    .boot-spinner {
      display: flex;
      justify-content: center;
      padding-top: 30vh;
      animation: boot-fade-in .2s ease-out .3s both;
    }
    .boot-spinner span {
      width: 3rem;
      height: 3rem;
      border: .3125rem solid #d1e9ff;
      border-top-color: #103fef;
      border-radius: 50%;
      animation: boot-spin .8s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-spinner span { animation: boot-pulse 1.6s ease-in-out infinite; }
    }
    @keyframes boot-spin { to { transform: rotate(1turn); } }
    @keyframes boot-pulse { 50% { opacity: .4; } }
    @keyframes boot-fade-in { from { opacity: 0; } }
