<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loading…</title>
    <script>
      (function () {
        var adminPath = '/admin';
        var path = location.pathname;
        var app = path === adminPath || path.indexOf(adminPath + '/') === 0 ? adminPath + '/' : '/';
        fetch(app + 'index.html')
          .then(function (response) {
            return response.text();
          })
          .then(function (html) {
            document.open();
            document.write(html);
            document.close();
          });
      })();
    </script>
  </head>
  <body></body>
</html>
